# Importer-Service (One-Shot-Job): Delta-Download, Parser, DB-Import,
# Index-Feed, Backup. Quellverzeichnis importer/app/ (ARCHITECTURE §10),
# Import-Name: acoustid_importer

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "musicmeta-offline-importer"
version = "0.0.1"
description = "Delta-Importer und Index-Feed von musicmeta-offline"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "musicmeta-offline-shared",
    # Delta-Download (Phase 6): Streaming-GET mit Range-Resume und sauberen
    # Timeouts. Dieselbe Bibliothek wie im Index-Client des shared-Pakets.
    "httpx>=0.28.1",
    # DB-Import (Phase 7): Upserts, Transaktionen, `import_state`. Kommt
    # ohnehin ueber shared mit; hier ausdruecklich, weil der Importer den
    # Treiber direkt benutzt (Binary-Extra: Wheels inkl. libpq).
    "psycopg[binary]>=3.3.4",
]

[tool.setuptools]
# Neue Unterpakete unterhalb von app/ hier ergaenzen.
packages = ["acoustid_importer"]

[tool.setuptools.package-dir]
acoustid_importer = "app"

[tool.uv.sources]
musicmeta-offline-shared = { workspace = true }

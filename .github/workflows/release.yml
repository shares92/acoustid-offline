# Ein Release = ein Image = ein Tag (HANDOFF v2 §10.12, §12).
#
# In v1 baute die CI drei Images unter einem gemeinsamen Tag; seit dem
# Ein-Container-Umbau (M1b) gibt es genau eines. Dieser Workflow ist der
# Weg dorthin: ein SemVer-Tag (`v1.2.3`, auch mit Vorabteil) erzeugt das
# Image und schiebt es nach GHCR.
#
# **Nur linux/amd64** (E3): der acoustid-index ist bislang nur dort erprobt
# und haengt unter QEMU still. Die Multi-Arch-Zusage aus v2 §12 ist auf
# „amd64 verpflichtend, arm64 nach Machbarkeitsnachweis" relativiert (K1);
# der aarch64-Spike steht vor M9 an und ergaenzt dann `platforms`.
#
# **Beim ersten Push von Hand auf oeffentlich stellen:** GHCR legt ein neues
# Paket privat an, und ein privates Image kann niemand ziehen. Die alten
# `acoustid-offline-*`-Pakete bleiben stehen und werden als „eingestellt"
# markiert (E16) — nie loeschen, sonst brechen bestehende Installationen.

name: Release

on:
  push:
    tags:
      # Bewusst eng: `v*` liesse auch `v2` oder `v1.2` durch. Das ist kein
      # gueltiges SemVer, `docker/metadata-action` erzeugt daraus keinen
      # Versionstag (nur eine Warnung im Log) — herauskaeme ein Push, der
      # ausschliesslich `latest` verschiebt.
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image bauen und nach GHCR schieben
    runs-on: ubuntu-latest

    steps:
      # `images:` unten leitet sich aus `github.repository` ab. Vor dem
      # GitHub-Rename zeigt das noch auf das alte Paket, waehrend die
      # docker-compose.yml bereits `musicmeta-offline` zieht — ein Tag in
      # diesem Fenster erzeugte ein Image, das niemand findet. Der Guard
      # erledigt sich nach dem Rename von selbst.
      - name: Rename-Reihenfolge erzwingen
        if: github.repository != 'shares92/musicmeta-offline'
        run: |
          echo "v*-Tag erst NACH dem GitHub-Rename (PROGRESS M2)"; exit 1

      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Docker-Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` kommt aus dem Vorgabeverhalten `flavor: latest=auto`:
          # es setzt die Marke genau bei einem stabilen SemVer-Treffer und
          # laesst Vorabversionen aus — ein `v2.0.0-rc1` als `latest` waere
          # die Falle, in die ein Betreiber ohne Pin laeuft.
          #
          # Eine eigene `type=raw`-Regel dafuer waere gefaehrlicher als
          # nuetzlich: sie greift auch dann, wenn die semver-Muster gar
          # nicht zuenden, und schoebe `latest` auf einen Stand, zu dem es
          # keinen Versionstag gibt.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Image bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Die eingebackenen Versionen bleiben am Image ablesbar (v2 §12);
          # die Labels aus dem Dockerfile werden dabei nicht ueberschrieben.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=musicmeta-image
          cache-to: type=gha,mode=max,scope=musicmeta-image

      - name: Eingebackene Versionen protokollieren
        # Damit der Release-Lauf selbst belegt, was ausgeliefert wurde —
        # dieselbe Auskunft, die `/status` spaeter im Betrieb gibt.
        run: |
          docker buildx imagetools inspect \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" \
            --format '{{ json .Image.Config.Labels }}'

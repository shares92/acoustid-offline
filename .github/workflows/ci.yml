name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: uv einrichten
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Abhaengigkeiten installieren
        run: uv sync --all-packages

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Tests (pytest, alle Pakete)
        # Integrationstests sind hier ohne Datenbank abgewaehlt (mit Meldung
        # im Report); sie laufen im Job `integration-tests`.
        run: uv run pytest --integration=off

  integration-tests:
    name: Integrationstests (Service-Container)
    runs-on: ubuntu-latest

    # Service-Container sind Testinfrastruktur und ausdruecklich von der
    # Ein-Container-Regel ausgenommen (DECISIONS 2026-08-04, E16): sie sind
    # der schnelle Weg, und der Lauf gegen das **eigene** Image steht im Job
    # `image-tests` darunter.
    services:
      db:
        # Gleiche Major-Version wie im docker-compose.yml des Projekts.
        image: postgres:18
        env:
          POSTGRES_DB: acoustid
          POSTGRES_USER: acoustid
          # Nur fuer diesen Lauf; kein Secret, die DB ist nach dem Job weg.
          POSTGRES_PASSWORD: ci-wegwerf-passwort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acoustid -d acoustid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      index:
        # Derselbe Digest wie im docker-compose.yml (GHCR ist oeffentlich,
        # kein Login noetig). Nur linux/amd64 — passt zu ubuntu-latest.
        image: ghcr.io/acoustid/acoustid-index@sha256:c27a992649785dfd5385f2c7702a1b3942dbe609635aa79229a8ae520abdf578
        ports:
          - 6081:6081
        # Anders als im Compose-Stack wird hier gegen das globale /_health
        # geprueft (reine Lebendpruefung): die Tests legen ihre Indizes selbst
        # an, es gibt also keinen festen Indexnamen, auf den zu warten waere.
        # curl gibt es im Image nicht, wget schon (GNU wget 1.21.4).
        options: >-
          --health-cmd "wget --quiet --tries=1 --timeout=5 --spider http://127.0.0.1:6081/_health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MMO_DB_HOST: 127.0.0.1
      MMO_DB_PORT: "5432"
      MMO_DB_NAME: acoustid
      MMO_DB_USER: acoustid
      MMO_DB_PASSWORD: ci-wegwerf-passwort
      MMO_INDEX_URL: http://127.0.0.1:6081
      MMO_INDEX_NAME: main

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: uv einrichten
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Abhaengigkeiten installieren
        run: uv sync --all-packages

      - name: Dump-Fixtures aus dem Cache holen
        # Die Tagesdeltas liegen nicht im Repo (Lizenz, Groesse). Der Cache
        # sorgt dafuer, dass data.acoustid.org nicht bei jedem Lauf angefragt
        # wird — die Dateien sind upstream unveraenderlich, der Schluessel
        # haengt deshalb nur an der Dateiliste im Skript.
        uses: actions/cache@v6
        with:
          path: tests/fixtures/acoustid-dumps
          key: acoustid-dumps-${{ hashFiles('tests/fixtures/fetch_fixtures.py') }}

      - name: Fehlende Dump-Fixtures nachladen
        run: uv run python tests/fixtures/fetch_fixtures.py

      - name: Integrationstests (Postgres und acoustid-index)
        # --integration=require: ein nicht erreichbarer Dienst ist ein Fehler,
        # kein stilles Ueberspringen.
        # `not extension`: die Bit-Verifikation braucht einen anderen
        # Container (Postgres MIT pg_acoustid) und laeuft im Job darunter.
        run: uv run pytest -m "integration and not extension" --integration=require

  image-tests:
    name: Eigenes Image (selbst gebauter fpindex + Postgres 18)
    runs-on: ubuntu-latest

    # Der Job, ohne den die CI ein **anderes Artefakt** testen wuerde als das
    # Release (M0-Analyse §2.3): bis M1a liefen die Integrationstests gegen
    # den Upstream-Digest des Index. Hier laufen sie gegen das Binary, das
    # tatsaechlich ausgeliefert wird.
    env:
      MMO_DB_HOST: 127.0.0.1
      MMO_DB_PORT: "5432"
      MMO_DB_NAME: acoustid
      MMO_DB_USER: acoustid
      MMO_DB_PASSWORD: ci-wegwerf-passwort
      MMO_INDEX_URL: http://127.0.0.1:6081
      MMO_INDEX_NAME: main

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: uv einrichten
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Abhaengigkeiten installieren
        run: uv sync --all-packages

      - name: Docker-Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen
        # Der Zig-Build des Index und die apt-Schichten sollen nicht bei
        # jedem Lauf neu entstehen.
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: musicmeta-offline:test
          cache-from: type=gha,scope=musicmeta-image
          cache-to: type=gha,mode=max,scope=musicmeta-image

      - name: Image-Groesse und eingebackene Versionen melden
        run: |
          docker image inspect musicmeta-offline:test --format 'Image-Groesse: {{ .Size }} Bytes'
          docker image inspect musicmeta-offline:test \
            --format 'acoustid-index: {{ index .Config.Labels "org.musicmeta.acoustid-index.commit" }}'
          docker run --rm --entrypoint /bin/sh musicmeta-offline:test -c \
            '/usr/lib/postgresql/18/bin/postgres --version; /opt/supervisor/bin/supervisord --version'

      - name: Datendienste aus dem eigenen Image starten
        run: |
          docker compose -f tests/docker-compose.test.yml up -d --wait --wait-timeout 300
          docker compose -f tests/docker-compose.test.yml ps

      - name: Dump-Fixtures aus dem Cache holen
        uses: actions/cache@v6
        with:
          path: tests/fixtures/acoustid-dumps
          key: acoustid-dumps-${{ hashFiles('tests/fixtures/fetch_fixtures.py') }}

      - name: Fehlende Dump-Fixtures nachladen
        run: uv run python tests/fixtures/fetch_fixtures.py

      - name: Integrationstests gegen das eigene Image
        run: uv run pytest -m "integration and not extension" --integration=require

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose -f tests/docker-compose.test.yml logs

      - name: Aufraeumen
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v

  bit-verification:
    name: Bit-Verifikation des Rescorings (pg_acoustid)
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: uv einrichten
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Abhaengigkeiten installieren
        run: uv sync --all-packages

      - name: Docker-Buildx einrichten
        # Nur wegen des Layer-Caches unten: das Image kompiliert die Extension
        # aus dem Quelltext, das soll nicht bei jedem Lauf passieren.
        uses: docker/setup-buildx-action@v3

      - name: Test-Image mit der Original-Extension bauen
        # Das Image wird NIE veroeffentlicht (pg_acoustid hat keine Lizenz,
        # DECISIONS 2026-07-25) — es bleibt im Runner und dient nur als
        # Referenz fuer den Python-Nachbau.
        uses: docker/build-push-action@v6
        with:
          context: tests/pg_acoustid
          load: true
          tags: acoustid-offline-pg-acoustid:test
          cache-from: type=gha,scope=pg-acoustid
          cache-to: type=gha,mode=max,scope=pg-acoustid

      - name: Referenz-Postgres starten
        run: |
          docker run -d --name pg-acoustid \
            -p 127.0.0.1:5443:5432 \
            -e POSTGRES_PASSWORD=ci-wegwerf-passwort \
            acoustid-offline-pg-acoustid:test
          for i in $(seq 1 60); do
            if docker exec pg-acoustid pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "pg_acoustid ist nicht hochgekommen" >&2
          docker logs pg-acoustid
          exit 1

      - name: Dump-Fixtures aus dem Cache holen
        # Dieselben Fixtures wie im Integrationsjob: die Bit-Verifikation
        # laeuft zusaetzlich gegen echte Vollvektoren.
        uses: actions/cache@v6
        with:
          path: tests/fixtures/acoustid-dumps
          key: acoustid-dumps-${{ hashFiles('tests/fixtures/fetch_fixtures.py') }}

      - name: Fehlende Dump-Fixtures nachladen
        run: uv run python tests/fixtures/fetch_fixtures.py

      - name: extract_query und compare2 gegen die Extension pruefen
        env:
          ACOUSTID_EXTENSION_DSN: postgresql://postgres:ci-wegwerf-passwort@127.0.0.1:5443/postgres
        run: uv run pytest -m extension --integration=require

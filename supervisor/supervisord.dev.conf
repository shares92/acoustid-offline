; supervisord.dev.conf — NUR fuer lokale Integrationstests und CI.
;
; Faehrt aus demselben Image ausschliesslich die beiden Datendienste hoch,
; gegen die die Integrationstests laufen (Postgres + acoustid-index), und
; laesst Waechter und API weg. Damit testet die Suite genau die Artefakte,
; die auch ausgeliefert werden — insbesondere den **selbst gebauten**
; fpindex und nicht den Upstream-Digest (M0-Analyse §2.3).
;
; Verwendung: tests/docker-compose.test.yml (dort als `command:` gesetzt).
; Im Betrieb hat diese Datei nichts zu suchen: `autostart=true` fuer die
; Datenbank waere ein Idle-Stopp, der sich selbst rueckgaengig macht.

[supervisord]
nodaemon=true
logfile=/config/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=1
pidfile=/run/supervisord.pid
childlogdir=/config/logs
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:db]
command=/usr/local/bin/mmo-postgres
user=postgres
autostart=true
autorestart=unexpected
startretries=3
startsecs=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:index]
command=/usr/local/bin/mmo-fpindex
user=acoustid
autostart=true
autorestart=unexpected
startretries=3
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

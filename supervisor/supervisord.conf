; supervisord.conf — Prozessdefinitionen des Ein-Container-Betriebs
; (HANDOFF v2 §3, DECISIONS 2026-08-04 E1/E12/E15/E16).
;
; Vier Dauerdienste, zwei Lebenszyklen:
;
;   watchdog   laeuft immer     — Proxy, /status, Admin-UI, Steuerung
;   index      laeuft immer     — resident (E12): der Kaltstart liest den
;                                 kompletten Index per MAP_POPULATE, und auf
;                                 dem SSD-Cache haelt er kein Array wach
;   db, api    schlafen         — der Waechter startet und stoppt sie
;
; **Jobs stehen hier nicht** (E10): Importer, Crawler und Backup brauchen
; Per-Lauf-Argumente, die `[program:*]` nicht kennt — sie laufen ab M2.5 als
; Subprozesse des Waechters.
;
; Die Supervision-Politik ist E15 und wird von Regressionstests in beiden
; Richtungen gemessen (`autostart=false` = ein Idle-Stopp bleibt stehen;
; `autorestart=unexpected` = ein Absturz wird geheilt).

[supervisord]
nodaemon=true
; PID 1 ist `tini` (Zombie-Reaping, Signalweiterleitung); supervisord ist
; sein Kind und braucht keinen eigenen PID-Namensraum-Sonderweg.
logfile=/config/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid
childlogdir=/config/logs
loglevel=info
; Keine `user=`-Zeile: supervisord selbst laeuft als root, sonst koennte es
; die Kinder nicht unter `postgres`/`acoustid` starten.

[unix_http_server]
; Der einzige Steuerweg — kein `inet_http_server` (E16). 0700, damit nur
; root (Waechter und supervisorctl im Container) Prozesse steuern kann.
; Kurzer Pfad mit Absicht: AF_UNIX-Socketnamen sind auf ~104 Byte begrenzt.
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --- Postgres (schlaeft) -----------------------------------------------------

[program:db]
command=/usr/local/bin/mmo-postgres
user=postgres
autostart=false
autorestart=unexpected
startretries=3
; `startsecs`: Postgres meldet sich im Log als bereit, lauscht aber schon
; vorher. 5 s reichen, um einen sofortigen Absturz (falsches PGDATA,
; Rechteproblem) von einem echten Start zu unterscheiden; die *fachliche*
; Bereitschaft prueft der Waechter mit `pg_isready`.
;
; GEMESSEN (M1b, leeres Cluster, colima/Rosetta): `stopProcess` 0,23 s,
; `startProcess` 5,30 s — die Startzeit ist also fast vollstaendig dieses
; `startsecs` und nicht Postgres. Am echten Bestand wird das anders
; aussehen (Recovery); erst diese Messung auf der Zielhardware entscheidet,
; ob sich ein kleinerer Wert lohnt. Vorher nicht drehen.
startsecs=5
; SIGINT = Fast Shutdown. SIGTERM waere Smart Shutdown und wartet auf den
; letzten Client — mit einem haengenden Lookup wuerde jeder Idle-Stopp in
; SIGKILL enden und die naechste Weckung mit einer Recovery beginnen (R10).
stopsignal=INT
; Grosszuegig: der Checkpoint eines 200-GB-Bestands darf fertig werden.
; Muss unter der `stop_grace_period` des Containers bleiben und unter dem
; Lese-Timeout des SupervisorClient (watchdog/app/process.py).
stopwaitsecs=300
stdout_logfile=/config/logs/db.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

; --- Suchindex (resident, E12) -----------------------------------------------

[program:index]
command=/usr/local/bin/mmo-fpindex
user=acoustid
; Abweichung von der Schlaf-Gruppe (E12, bewusste Korrektur von v2 §1.2/§3):
; der Index startet mit dem Container und wird beim Idle-Stopp nicht
; gestoppt. Mess-Vorbehalt: Index-Kaltstart auf SSD (M1b/Probelauf).
autostart=true
autorestart=unexpected
startretries=3
startsecs=5
stopwaitsecs=60
stdout_logfile=/config/logs/index.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

; --- API-Dienst (schlaeft) ---------------------------------------------------

[program:api]
command=/app/.venv/bin/python -m acoustid_api
; Der EINZIGE Prozess, der Fremdeingaben verarbeitet — und deshalb der
; einzige, bei dem root ein echtes Risiko waere: mit root koennte ein
; Exploit trotz `chmod=0700` den Supervisor-Socket oeffnen (root umgeht
; Dateirechte) und damit Prozesse steuern, und er koennte das
; Datenbank-Passwort lesen. Als `api` (6082:6080) kann er beides nicht.
;
; **Der Waechter bleibt bewusst root** (unten): er braucht genau diesen
; Socket, um den Stack zu steuern — das ist seine Aufgabe (Invariante
; §8.1). Der Tradeoff ist damit bewusst gewaehlt und nicht vergessen: die
; Angriffsflaeche mit Fremdeingaben (API-Proxy-Ziel) ist unprivilegiert,
; die Steuerung liegt bei dem Dienst, der ohnehin nur eigene Endpunkte
; bedient und dessen Eingaben der Waechter selbst gefiltert hat.
;
; Was der Dienst dafuer braucht, liegt in der Gruppe `musicmeta`:
; /config/config.yaml und /config/db-password (0640, Gruppe erbt der
; Entrypoint ueber das setgid-Bit auf /config).
user=api
directory=/
autostart=false
autorestart=unexpected
startretries=3
startsecs=5
; uvicorn beendet sich auf SIGTERM geordnet; laufende Anfragen bekommen
; ihre Frist.
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/config/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

; --- Waechter (laeuft immer) -------------------------------------------------

[program:watchdog]
; Laeuft als root — bewusst: er steuert supervisord ueber den Socket
; (Invariante §8.1) und legt beim Erststart Verzeichnisse und Rechte an.
; Sein Angriffsflaechen-Profil ist ein anderes als das der API: er
; beantwortet `/status` und `/admin`, und alles, was er weiterreicht,
; hat er vorher durch Rate-Limit und Key-Pruefung geschickt.
;
; Doppelter Ausgang mit Absicht (E16): in die Datei unter /config **und**
; auf die Container-Ausgabe. Der Erststart schreibt das Admin-Passwort ins
; Log, und der dokumentierte Weg dorthin ist `docker logs` — ohne stdout
; waere er tot. `stopasgroup`/`killasgroup`, weil die Pipeline eine `sh`
; als Elternprozess hat: das Signal muss die ganze Gruppe erreichen.
command=/bin/sh -c 'exec /app/.venv/bin/python -m acoustid_watchdog 2>&1 | tee -a /config/logs/watchdog.log'
directory=/
autostart=true
; Der einzige Dienst mit bedingungslosem Neustart: faellt er aus, ist die
; Instanz von aussen nicht mehr erreichbar und niemand weckt mehr etwas.
autorestart=true
startretries=10
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; Nach /dev/fd/1 = Container-Ausgabe; die Datei schreibt `tee` oben.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

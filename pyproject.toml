# Workspace-Wurzel von acoustid-offline.
#
# Der Repo-Root ist ein virtuelles uv-Projekt (kein eigenes Paket): er bindet
# die vier Member-Pakete ein und traegt die zentrale Tooling-Konfiguration
# (ruff, pytest) fuer das gesamte Repo.
#
# Verzeichnis-Layout gemaess ARCHITECTURE.md §10; die Import-Namen sind
# bewusst eindeutig, weil alle Pakete in ein gemeinsames venv installiert
# werden (drei Pakete koennten sonst nicht gleichzeitig "app" heissen):
#
#   shared/shared/   -> import shared
#   api/app/         -> import acoustid_api
#   importer/app/    -> import acoustid_importer
#   watchdog/app/    -> import acoustid_watchdog

[project]
name = "acoustid-offline"
version = "0.0.1"
description = "Selbst gehostete, offline-faehige AcoustID-Instanz (Workspace-Wurzel)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "acoustid-offline-shared",
    "acoustid-offline-api",
    "acoustid-offline-importer",
    "acoustid-offline-watchdog",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "api", "importer", "watchdog"]

[tool.uv.sources]
acoustid-offline-shared = { workspace = true }
acoustid-offline-api = { workspace = true }
acoustid-offline-importer = { workspace = true }
acoustid-offline-watchdog = { workspace = true }

# --- Lint & Format (zentral fuer alle Pakete) ------------------------------
# ruff sucht von jeder Datei aus die naechste pyproject.toml MIT [tool.ruff];
# die Member-pyprojects haben bewusst keine, damit diese Sektion ueberall gilt.
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tests/fixtures/acoustid-dumps"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-spezifisch
]

[tool.ruff.lint.isort]
# Alle vier Workspace-Pakete gehoeren in den First-Party-Block.
known-first-party = ["shared", "acoustid_api", "acoustid_importer", "acoustid_watchdog"]

[tool.ruff.format]
docstring-code-format = true

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "tests",
    "shared/tests",
    "api/tests",
    "importer/tests",
    "watchdog/tests",
]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: braucht einen erreichbaren Compose-Dienst — Steuerung ueber --integration, siehe conftest.py",
    "index: (zusammen mit integration) braucht den acoustid-index statt der Postgres",
    "db: (nur zusammen mit index noetig) braucht die Postgres zusaetzlich zum Index",
    "extension: braucht die Original-Extension pg_acoustid im Test-Container (ACOUSTID_EXTENSION_DSN), siehe tests/pg_acoustid/",
    "network: greift auf das echte Internet zu (data.acoustid.org) — laeuft nur mit --network, nie in der CI",
    "compose: faehrt den echten Compose-Stack hoch (Docker noetig) — laeuft nur mit --compose, nie in der CI",
]

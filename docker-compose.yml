# docker-compose.yml — Stack von acoustid-offline (ARCHITECTURE §10).
#
# Enthaelt die Dienste, die der Waechter bei Bedarf startet und stoppt:
# api, importer (One-Shot-Job), db und index. Der Waechter selbst laeuft
# dauerhaft aus docker-compose.watchdog.yml — bewusst getrennt, damit ein
# `down` dieses Stacks die Steuerung nicht mit abraeumt.
#
# Werte kommen aus der .env im selben Verzeichnis (Vorlage: .env.example,
# verbindliches Schema: shared/shared/env.py). Die .env wird nie committet.
#
# Stand Phase 5: `db` und `index`. Die uebrigen Dienste kommen in ihren Phasen
# dazu (Platzhalter unten), damit hier keine ungetesteten Definitionen liegen.

name: acoustid-offline

services:

  db:
    # AcoustID-Postgres (Stack, Array). Offizielles Image, aktuelle stabile
    # Major-Version; Minor-Updates kommen ueber ein `pull` des Major-Tags.
    image: postgres:18
    container_name: acoustid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AOFF_DB_NAME:-acoustid}
      POSTGRES_USER: ${AOFF_DB_USER:-acoustid}
      # Pflichtwert: ohne Passwort bricht `up` mit dieser Meldung ab.
      POSTGRES_PASSWORD: ${AOFF_DB_PASSWORD:?AOFF_DB_PASSWORD fehlt - bitte in der .env setzen}
      # Kein POSTGRES_HOST_AUTH_METHOD=trust: auch im internen Netz mit Passwort.
    command: ["postgres", "-c", "port=${AOFF_DB_PORT:-5432}"]
    # Nur im Compose-Netz erreichbar, kein Host-Publish (ARCHITECTURE §3):
    # die Datenbank spricht ausschliesslich mit api und importer.
    expose:
      - "${AOFF_DB_PORT:-5432}"
    volumes:
      # Achtung, Aenderung ab Postgres 18: das Image deklariert
      # /var/lib/postgresql als Volume und legt die Daten darunter in
      # /var/lib/postgresql/18/docker ab (frueher /var/lib/postgresql/data).
      # Der Mountpunkt ist deshalb das Elternverzeichnis.
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AOFF_DB_USER:-acoustid} -d ${AOFF_DB_NAME:-acoustid} -p ${AOFF_DB_PORT:-5432}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Erststart legt das Cluster an; danach greift der Intervall-Check.
      start_period: 60s

  index:
    # Fingerprint-Suchindex (ARCHITECTURE §5.3). Das Projekt hat keinen
    # Release-Prozess und nur das bewegliche Tag `main`, deshalb per Digest
    # gepinnt (DECISIONS 2026-07-25 "Index-Image per Digest gepinnt").
    # Tag zum Digest: main (Stand 2025-10-27, Commit 6bc929a).
    # Aktualisieren:  docker manifest inspect --verbose \
    #                   ghcr.io/acoustid/acoustid-index:main | grep -m1 digest
    # Nur linux/amd64 — es gibt keine Manifest-Liste und keinen arm64-Build.
    image: ghcr.io/acoustid/acoustid-index@sha256:c27a992649785dfd5385f2c7702a1b3942dbe609635aa79229a8ae520abdf578
    container_name: acoustid-index
    restart: unless-stopped
    # Das Image setzt USER acoustid (UID/GID 6081); hier noch einmal
    # ausdruecklich, damit die Rechte des Volumes nachvollziehbar bleiben.
    # Auf Unraid den Share entsprechend chownen — NICHT 99:100 (nobody/users).
    user: "6081:6081"
    # Kein Host-Publish: der Index hat weder Auth noch TLS und darf das Netz
    # nie sehen (ARCHITECTURE §3, §5.3). Zugriff nur aus dem Compose-Netz;
    # fuer lokale Tests siehe tests/docker-compose.test.yml.
    expose:
      - "6081"
    volumes:
      # VOLUME-Pfad des Images. Erwartete Groesse 40–55 GB, Volume ~70 GB.
      # Unraid: auf SSD-Cache-Pool, Share Prefer/Only: Cache (DECISIONS 2026-07-25)
      - index-data:/var/lib/acoustid-index
    healthcheck:
      # Im Image gibt es weder curl noch nc noch python — aber GNU wget 1.21.4
      # (empirisch im gepinnten Image geprueft). `--spider` schickt ein HEAD
      # und liefert Exitcode 0 bei 200, 8 bei 404.
      #
      # Geprueft wird bewusst /<index>/_health und nicht /_health: das globale
      # /_health prueft inhaltlich nichts (auch ein Server ohne jeden Index
      # antwortet 200). Folge: der Dienst wird erst gesund, wenn der Index
      # angelegt ist (`ensure_index` beim Bootstrap/Import). Dienste, die den
      # Index erst anlegen (importer), duerfen daher nur mit
      # `condition: service_started` von ihm abhaengen — `service_healthy`
      # nur fuer Leser wie die api.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--timeout=5",
          "--spider",
          "http://127.0.0.1:6081/${AOFF_INDEX_NAME:-main}/_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Der Start liest den kompletten Index in den Page-Cache (MAP_POPULATE):
      # produktiv ~15 min bei 40–55 GB (Forschungsbericht §"mmap-Verhalten").
      # Solange zaehlen Fehlversuche nicht; ein Treffer macht sofort gesund.
      start_period: 900s

  # --- Platzhalter, kommen in ihren Phasen dazu ----------------------------
  #
  # api:       Phase 9  — eigenes Image, container_name acoustid-api,
  #            depends_on db+index (condition: service_healthy), kein ports:
  #            (der Waechter proxyt), Env aus .env.
  # importer:  Phase 7  — One-Shot-Job, container_name acoustid-importer,
  #            profiles: ["job"] (laeuft nicht bei `up`, sondern per
  #            `compose run`), restart: "no", Dump-Volume AOFF_DUMP_DIR,
  #            depends_on index mit condition: service_started (siehe oben).

volumes:
  db-data:
  # Unraid: auf SSD-Cache-Pool, Share Prefer/Only: Cache (DECISIONS 2026-07-25)
  index-data:

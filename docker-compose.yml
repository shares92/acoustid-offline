# docker-compose.yml — Stack von acoustid-offline (ARCHITECTURE §10).
#
# Enthaelt die Dienste, die der Waechter bei Bedarf startet und stoppt:
# api, importer (One-Shot-Job), db und index. Der Waechter selbst laeuft
# dauerhaft aus docker-compose.watchdog.yml — bewusst getrennt, damit ein
# `down` dieses Stacks die Steuerung nicht mit abraeumt.
#
# Werte kommen aus der .env im selben Verzeichnis (Vorlage: .env.example,
# verbindliches Schema: shared/shared/env.py). Die .env wird nie committet.
#
# Stand Phase 9: `db`, `index`, `importer` (Profil `job`) und `api`.

name: acoustid-offline

services:

  db:
    # AcoustID-Postgres (Stack, Array). Offizielles Image, aktuelle stabile
    # Major-Version; Minor-Updates kommen ueber ein `pull` des Major-Tags.
    image: postgres:18
    container_name: acoustid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AOFF_DB_NAME:-acoustid}
      POSTGRES_USER: ${AOFF_DB_USER:-acoustid}
      # Pflichtwert: ohne Passwort bricht `up` mit dieser Meldung ab.
      POSTGRES_PASSWORD: ${AOFF_DB_PASSWORD:?AOFF_DB_PASSWORD fehlt - bitte in der .env setzen}
      # Kein POSTGRES_HOST_AUTH_METHOD=trust: auch im internen Netz mit Passwort.
    command: ["postgres", "-c", "port=${AOFF_DB_PORT:-5432}"]
    # Nur im Compose-Netz erreichbar, kein Host-Publish (ARCHITECTURE §3):
    # die Datenbank spricht ausschliesslich mit api und importer.
    expose:
      - "${AOFF_DB_PORT:-5432}"
    volumes:
      # Achtung, Aenderung ab Postgres 18: das Image deklariert
      # /var/lib/postgresql als Volume und legt die Daten darunter in
      # /var/lib/postgresql/18/docker ab (frueher /var/lib/postgresql/data).
      # Der Mountpunkt ist deshalb das Elternverzeichnis.
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AOFF_DB_USER:-acoustid} -d ${AOFF_DB_NAME:-acoustid} -p ${AOFF_DB_PORT:-5432}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Erststart legt das Cluster an; danach greift der Intervall-Check.
      start_period: 60s

  index:
    # Fingerprint-Suchindex (ARCHITECTURE §5.3). Das Projekt hat keinen
    # Release-Prozess und nur das bewegliche Tag `main`, deshalb per Digest
    # gepinnt (DECISIONS 2026-07-25 "Index-Image per Digest gepinnt").
    # Tag zum Digest: main (Stand 2025-10-27, Commit 6bc929a).
    # Aktualisieren:  docker manifest inspect --verbose \
    #                   ghcr.io/acoustid/acoustid-index:main | grep -m1 digest
    # Nur linux/amd64 — es gibt keine Manifest-Liste und keinen arm64-Build.
    image: ghcr.io/acoustid/acoustid-index@sha256:c27a992649785dfd5385f2c7702a1b3942dbe609635aa79229a8ae520abdf578
    container_name: acoustid-index
    restart: unless-stopped
    # Das Image setzt USER acoustid (UID/GID 6081); hier noch einmal
    # ausdruecklich, damit die Rechte des Volumes nachvollziehbar bleiben.
    # Auf Unraid den Share entsprechend chownen — NICHT 99:100 (nobody/users).
    user: "6081:6081"
    # Kein Host-Publish: der Index hat weder Auth noch TLS und darf das Netz
    # nie sehen (ARCHITECTURE §3, §5.3). Zugriff nur aus dem Compose-Netz;
    # fuer lokale Tests siehe tests/docker-compose.test.yml.
    expose:
      - "6081"
    volumes:
      # VOLUME-Pfad des Images. Erwartete Groesse 40–55 GB, Volume ~70 GB.
      # Unraid: auf SSD-Cache-Pool, Share Prefer/Only: Cache (DECISIONS 2026-07-25)
      - index-data:/var/lib/acoustid-index
    healthcheck:
      # Im Image gibt es weder curl noch nc noch python — aber GNU wget 1.21.4
      # (empirisch im gepinnten Image geprueft). `--spider` schickt ein HEAD
      # und liefert Exitcode 0 bei 200, 8 bei 404.
      #
      # Geprueft wird bewusst /<index>/_health und nicht /_health: das globale
      # /_health prueft inhaltlich nichts (auch ein Server ohne jeden Index
      # antwortet 200). Folge: der Dienst wird erst gesund, wenn der Index
      # angelegt ist (`ensure_index` beim Bootstrap/Import). Dienste, die den
      # Index erst anlegen (importer), duerfen daher nur mit
      # `condition: service_started` von ihm abhaengen — `service_healthy`
      # nur fuer Leser wie die api.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--timeout=5",
          "--spider",
          "http://127.0.0.1:6081/${AOFF_INDEX_NAME:-main}/_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Der Start liest den kompletten Index in den Page-Cache (MAP_POPULATE):
      # produktiv ~15 min bei 40–55 GB (Forschungsbericht §"mmap-Verhalten").
      # Solange zaehlen Fehlversuche nicht; ein Treffer macht sofort gesund.
      start_period: 900s

  importer:
    # One-Shot-Job: Delta-Download, DB-Import, Index-Feed (ARCHITECTURE §5.2,
    # §5.3). Laeuft NICHT bei `up` — er gehoert dem Profil `job` an und wird
    # gezielt gestartet:
    #
    #   docker compose --profile job run --rm importer                  # taeglich
    #   docker compose --profile job run --rm importer --mode bootstrap # Erst-Import
    #   docker compose --profile job run --rm importer \
    #     --mode bootstrap --end-date 2011-12-31 --report /data/dumps/probelauf.json
    #
    # Exit-Codes und Report-Format: docs/importer-job.md.
    #
    # Zwei Compose-Variablen bewusst OHNE `AOFF_`-Praefix (das ist der
    # Variablensatz von shared/shared/env.py, und der Container bekaeme sie
    # sonst als „unbekannt" gemeldet): ACOUSTID_IMPORTER_IMAGE waehlt ein
    # anderes Image, ACOUSTID_WATCHDOG_DATA ein Host-Verzeichnis fuer die
    # config.yaml des Waechters.
    profiles: ["job"]
    image: ${ACOUSTID_IMPORTER_IMAGE:-ghcr.io/shares92/acoustid-offline-importer:latest}
    build:
      context: .
      dockerfile: importer/Dockerfile
    container_name: acoustid-importer
    # Ein Job wird nicht neugestartet: sein Exit-Code ist das Ergebnis, und
    # der Waechter entscheidet, ob wiederholt wird (Invariante §8.4).
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      index:
        # Bewusst `service_started`: der Healthcheck des Index prueft
        # /<name>/_health und wird erst gruen, wenn der Index existiert —
        # angelegt wird er von genau diesem Job (Phase-5-Vermerk).
        condition: service_started
    environment:
      AOFF_DB_HOST: ${AOFF_DB_HOST:-acoustid-db}
      AOFF_DB_PORT: ${AOFF_DB_PORT:-5432}
      AOFF_DB_NAME: ${AOFF_DB_NAME:-acoustid}
      AOFF_DB_USER: ${AOFF_DB_USER:-acoustid}
      AOFF_DB_PASSWORD: ${AOFF_DB_PASSWORD:?AOFF_DB_PASSWORD fehlt - bitte in der .env setzen}
      AOFF_INDEX_URL: ${AOFF_INDEX_URL:-http://acoustid-index:6081}
      AOFF_INDEX_NAME: ${AOFF_INDEX_NAME:-main}
      AOFF_DATA_DIR: /data
      AOFF_DUMP_DIR: /data/dumps
      # Die Laufzeit-Konfiguration gehoert dem Waechter und wird hier nur
      # gelesen (`update.min_free_gb`, `index.query_hashes`) — deshalb ein
      # eigener, read-only gemounteter Pfad. Fehlt die Datei, gelten die
      # Defaults aus ARCHITECTURE §6.
      AOFF_CONFIG_PATH: /watchdog/config.yaml
      AOFF_LOG_LEVEL: ${AOFF_LOG_LEVEL:-INFO}
    volumes:
      # Arbeitsverzeichnis der Tagesdateien. Der Job loescht jede Datei nach
      # dem Commit, es liegen also nur der Vorlauf und die aktuelle darin;
      # trotzdem grosszuegig planen (eine Fingerprint-Tagesdatei der
      # Fruehzeit hat mehrere GB) — der Plattenplatz-Guard misst genau hier
      # (Invariante §8.8).
      - dump-data:/data/dumps
      # Datenverzeichnis des Waechters (Cache-Pool, docker-compose.watchdog.yml
      # ab Phase 14). Ueber ACOUSTID_WATCHDOG_DATA auf einen Host-Pfad umstellbar.
      - ${ACOUSTID_WATCHDOG_DATA:-watchdog-data}:/watchdog:ro

  api:
    # AcoustID-kompatible Web-API (ARCHITECTURE §7). Laeuft, solange der
    # Stack wach ist; der Waechter proxyt davor und setzt Auth und
    # Rate-Limit durch — deshalb KEIN `ports:` (ARCHITECTURE §3, §7).
    image: ${ACOUSTID_API_IMAGE:-ghcr.io/shares92/acoustid-offline-api:latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: acoustid-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      index:
        # Anders als der Importer ist die api ein reiner Leser: sie legt den
        # Index nicht an und darf deshalb auf den Healthcheck warten. Der
        # wird erst gruen, wenn `ensure_index()` gelaufen ist — das macht der
        # Importer beim Bootstrap (Phase-5-Vermerk).
        condition: service_healthy
    expose:
      - "8080"
    environment:
      AOFF_DB_HOST: ${AOFF_DB_HOST:-acoustid-db}
      AOFF_DB_PORT: ${AOFF_DB_PORT:-5432}
      AOFF_DB_NAME: ${AOFF_DB_NAME:-acoustid}
      AOFF_DB_USER: ${AOFF_DB_USER:-acoustid}
      AOFF_DB_PASSWORD: ${AOFF_DB_PASSWORD:?AOFF_DB_PASSWORD fehlt - bitte in der .env setzen}
      AOFF_INDEX_URL: ${AOFF_INDEX_URL:-http://acoustid-index:6081}
      AOFF_INDEX_NAME: ${AOFF_INDEX_NAME:-main}
      AOFF_DATA_DIR: /data
      # Die Laufzeit-Konfiguration gehoert dem Waechter und wird hier nur
      # gelesen. Wichtig ist `index.query_hashes`: die Suche muss denselben
      # Query-Extrakt bilden wie der Importer beim Indexieren, sonst findet
      # sie nichts. Fehlt die Datei, gelten die Defaults aus ARCHITECTURE §6.
      AOFF_CONFIG_PATH: /watchdog/config.yaml
      AOFF_LOG_LEVEL: ${AOFF_LOG_LEVEL:-INFO}
    volumes:
      # Datenverzeichnis des Waechters (Cache-Pool, docker-compose.watchdog.yml
      # ab Phase 14). Ueber ACOUSTID_WATCHDOG_DATA auf einen Host-Pfad umstellbar.
      - ${ACOUSTID_WATCHDOG_DATA:-watchdog-data}:/watchdog:ro

volumes:
  db-data:
  # Unraid: auf SSD-Cache-Pool, Share Prefer/Only: Cache (DECISIONS 2026-07-25)
  index-data:
  # Arbeitsverzeichnis des Importers (Tagesdateien). Braucht Platz fuer den
  # Prefetch-Vorlauf, nicht fuer die ganzen 414 GB — eingespielte Dateien
  # werden geloescht (--keep-dumps haelt sie).
  dump-data:
  # Nur ein Platzhalter, solange der Waechter fehlt (Phase 14): dort entsteht
  # das echte Datenverzeichnis auf dem Cache-Pool. Der Importer liest daraus
  # ausschliesslich die config.yaml.
  watchdog-data:

# Waechter (Dauerlaeufer auf dem Cache-Pool): Proxy mit Weck-Logik, Scheduler,
# Admin-UI, Lookup-Cache, Notifications, Metrics.
# Quellverzeichnis watchdog/app/ (ARCHITECTURE §10), Import-Name: acoustid_watchdog

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustid-offline-watchdog"
version = "0.0.1"
description = "Waechter (Proxy, Scheduler, Admin-UI) von acoustid-offline"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "acoustid-offline-shared",
    # Web-Framework laut ARCHITECTURE §4 — dieselbe Wahl wie im API-Dienst.
    # Ab Phase 14 traegt es `/status`, spaeter Proxy, Admin-UI und /metrics.
    "fastapi>=0.121.2",
    # ASGI-Server des Containers (`python -m acoustid_watchdog`).
    "uvicorn>=0.40.0",
    # Passwort-Hash des Admin-Logins (ARCHITECTURE §6 "Admin-Login": argon2).
    # Referenzimplementierung mit Wheels fuer alle Zielplattformen; SQLite
    # bringt Python selbst mit, dafuer braucht es keine Abhaengigkeit.
    "argon2-cffi>=25.1.0",
]

[tool.setuptools]
# Neue Unterpakete unterhalb von app/ hier ergaenzen.
packages = ["acoustid_watchdog"]

[tool.setuptools.package-dir]
acoustid_watchdog = "app"

# Admin-UI ohne Build-Schritt: Jinja2-Templates und statische Dateien
# wandern als Paketdaten mit ins Wheel.
[tool.setuptools.package-data]
acoustid_watchdog = ["templates/**", "static/**"]

[tool.uv.sources]
acoustid-offline-shared = { workspace = true }

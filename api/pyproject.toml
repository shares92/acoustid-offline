# API-Service: /v2/lookup, /v2/submit, /v2/lookup/batch, Index-Client, MB-Resolver.
# Quellverzeichnis api/app/ (ARCHITECTURE §10), Import-Name: acoustid_api

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustid-offline-api"
version = "0.0.1"
description = "AcoustID-kompatibler API-Service von acoustid-offline"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "acoustid-offline-shared",
    # Web-Framework laut ARCHITECTURE §4. Die Routen sind async, die Arbeit
    # dahinter (psycopg, Index-Client, Rescoring) laeuft im Threadpool.
    "fastapi>=0.121.2",
    # ASGI-Server des Containers (`python -m acoustid_api`).
    "uvicorn>=0.40.0",
    # Verbindungs-Pool fuer die kurzen, rein lesenden Lookups. psycopg
    # selbst kommt ueber shared mit.
    "psycopg-pool>=3.2.7",
]

[tool.setuptools]
# Neue Unterpakete unterhalb von app/ hier ergaenzen.
packages = ["acoustid_api"]

[tool.setuptools.package-dir]
acoustid_api = "app"

[tool.uv.sources]
acoustid-offline-shared = { workspace = true }
